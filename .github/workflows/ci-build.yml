name: Build Desktop Binaries

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact_name: LinUCommandTestGui-win-x64
          - os: ubuntu-latest
            rid: linux-x64
            artifact_name: LinUCommandTestGui-linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore tests
        run: dotnet restore LinUCommandTestGui.Tests/LinUCommandTestGui.Tests.csproj

      - name: Test platform behavior
        run: >
          dotnet test LinUCommandTestGui.Tests/LinUCommandTestGui.Tests.csproj
          -c Release
          --no-restore
          --logger "console;verbosity=normal"

  build:
    name: Build ${{ matrix.rid }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact_name: LinUCommandTestGui-win-x64
          - os: ubuntu-latest
            rid: linux-x64
            artifact_name: LinUCommandTestGui-linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore app for target runtime
        run: dotnet restore LinUCommandTestGui/LinUCommandTestGui.csproj -r ${{ matrix.rid }}

      - name: Publish
        run: >
          dotnet publish LinUCommandTestGui/LinUCommandTestGui.csproj
          -c Release
          -r ${{ matrix.rid }}
          --no-restore
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o artifacts/${{ matrix.rid }}

      - name: Package (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        env:
          ARTIFACT_BASENAME: ${{ matrix.artifact_name }}-${{ github.sha }}
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path "artifacts/${{ matrix.rid }}/*" -DestinationPath "dist/$env:ARTIFACT_BASENAME.zip" -Force

      - name: Package (Linux)
        if: matrix.rid == 'linux-x64'
        shell: bash
        env:
          ARTIFACT_BASENAME: ${{ matrix.artifact_name }}-${{ github.sha }}
        run: |
          mkdir -p dist
          chmod +x artifacts/${{ matrix.rid }}/LinUCommandTestGui || true
          tar -C artifacts/${{ matrix.rid }} -czf "dist/${ARTIFACT_BASENAME}.tar.gz" .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
